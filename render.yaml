services:
  - type: web
    name: printpick
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PLATFORM_NAME
        value: Printpick
      - key: OWNER_EMAIL        # your own email: this account is free forever
        sync: false
      - key: BASE_URL           # your site address, e.g. https://printpick.onrender.com
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRICE_LABEL
        value: "$19 / month"
      - key: TRIAL_DAYS
        value: "14"
      - key: STORAGE_LIMIT_GB
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
    disk:
      name: photos
      mountPath: /var/data
      sizeGB: 100
